[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tuik-mcp"
version = "0.1.0"
description = "MCP access to public TÜİK statistical resources"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp>=1.26,<2", "httpx>=0.28,<1", "pydantic>=2.11,<3", "beautifulsoup4>=4.13,<5"]

[project.optional-dependencies]
search = ["opensearch-py>=3,<4"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[project.scripts]
tuik-mcp = "tuik_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: optional tests using official TÜİK sources"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
