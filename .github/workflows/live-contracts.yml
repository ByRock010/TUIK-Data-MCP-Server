name: Live TÜİK contracts

on:
  schedule:
    # Weekly, Monday 06:17 UTC (09:17 Europe/Istanbul).
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      exercise_failure:
        description: "Exercise issue reporting without contacting TÜİK"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Keep a single issue reporter and avoid overlapping live traffic across refs.
concurrency:
  group: tuik-live-contracts
  cancel-in-progress: false

jobs:
  contracts:
    name: Weekly upstream contracts (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Prepare report directory
        run: mkdir -p artifacts

      - name: Install
        id: install
        run: python -m pip install -e '.[dev]' 2>&1 | tee artifacts/install.log

      - name: Live pytest
        id: pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' && !inputs.exercise_failure }}
        continue-on-error: true
        # The next step runs the full MCP workflow once and preserves its JSON report.
        run: pytest -m live -k 'not test_live_mcp_workflow' -q --junitxml=artifacts/live-tests.xml 2>&1 | tee artifacts/live-tests.log

      - name: MCP stdio live smoke
        id: smoke
        if: ${{ !cancelled() && steps.install.outcome == 'success' && !inputs.exercise_failure }}
        continue-on-error: true
        run: python scripts/live_smoke.py --output artifacts/live-report.json 2> artifacts/live-smoke.stderr.log

      - name: Exercise failure reporting
        id: exercise
        if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.exercise_failure }}
        continue-on-error: true
        run: |
          echo '{"status":"error","error_type":"InjectedFailure","message":"Issue #28 reporting exercise; no TÜİK requests made."}' > artifacts/live-report.json
          exit 1

      - name: Upload live reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tuik-live-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Open or update the upstream contract issue
        if: ${{ !cancelled() && (failure() || steps.pytest.outcome == 'failure' || steps.smoke.outcome == 'failure' || steps.exercise.outcome == 'failure') }}
        uses: actions/github-script@v7
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          EXERCISE_OUTCOME: ${{ steps.exercise.outcome }}
        with:
          script: |
            const report = require('./.github/scripts/report-live-contracts.cjs');
            await report({github, context, outcomes: {
              install: process.env.INSTALL_OUTCOME,
              pytest: process.env.PYTEST_OUTCOME,
              smoke: process.env.SMOKE_OUTCOME,
              exercise: process.env.EXERCISE_OUTCOME
            }});

      - name: Preserve a failed workflow result
        if: ${{ !cancelled() && (steps.pytest.outcome == 'failure' || steps.smoke.outcome == 'failure' || steps.exercise.outcome == 'failure') }}
        run: exit 1
