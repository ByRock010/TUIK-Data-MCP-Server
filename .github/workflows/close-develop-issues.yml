name: Close issues after develop merge

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: close-develop-issues-${{ github.sha }}
  cancel-in-progress: false

jobs:
  close-issues:
    if: ${{ !github.event.created && !github.event.deleted && !github.event.forced }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      # Execute the merged develop revision, never code from an unmerged PR head.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/github-script@v7
        with:
          script: |
            const closeIssues = require('./.github/scripts/close-develop-issues.cjs');
            await closeIssues({github, context, core});
