name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Branch policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const branchPolicy = require('./.github/scripts/branch-policy.cjs');
            core.info(branchPolicy({
              pull: context.payload.pull_request,
              repository: `${context.repo.owner}/${context.repo.repo}`
            }));

  test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e '.[dev,fixtures]'

      - name: Ruff lint
        run: ruff check src tests scripts

      - name: Ruff format
        run: ruff format --check src tests scripts

      - name: Develop issue-closing tests (no network)
        run: node --test .github/scripts/close-develop-issues.test.cjs

      - name: Branch policy tests (no network)
        run: node --test .github/scripts/branch-policy.test.cjs

      - name: Issue reporter tests (no network)
        run: node --test .github/scripts/report-live-contracts.test.cjs

      # Live tests hit real TÜİK endpoints and are excluded by default (addopts).
      - name: Pytest
        run: pytest -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t tuik-mcp .
