name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Branch policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const branchPolicy = require('./.github/scripts/branch-policy.cjs');
            core.info(branchPolicy({
              pull: context.payload.pull_request,
              repository: `${context.repo.owner}/${context.repo.repo}`
            }));

  test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e '.[dev,fixtures]'

      - name: Ruff lint
        run: ruff check src tests scripts

      - name: Ruff format
        run: ruff format --check src tests scripts

      - name: Develop issue-closing tests (no network)
        run: node --test .github/scripts/close-develop-issues.test.cjs

      - name: Branch policy tests (no network)
        run: node --test .github/scripts/branch-policy.test.cjs

      - name: Issue reporter tests (no network)
        run: node --test .github/scripts/report-live-contracts.test.cjs

      # Live tests hit real TÜİK endpoints and are excluded by default (addopts).
      - name: Pytest
        run: pytest -q

  opensearch:
    name: OpenSearch integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TUIK_OPENSEARCH_URL: http://127.0.0.1:9200
    services:
      opensearch:
        image: opensearchproject/opensearch:3.3.2
        env:
          discovery.type: single-node
          cluster.name: tuik-ci
          node.name: tuik-ci-1
          bootstrap.memory_lock: "true"
          # CI runners need no host vm.max_map_count changes when mmap is disabled.
          node.store.allow_mmap: "false"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          DISABLE_SECURITY_PLUGIN: "true"
        ports:
          - 127.0.0.1:9200:9200
        options: >-
          --ulimit memlock=-1:-1
          --ulimit nofile=65536:65536
          --health-cmd "curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 40s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev,fixtures]'
      - name: Verify cluster version and health
        run: |
          curl --fail --silent "$TUIK_OPENSEARCH_URL/"
          curl --fail --silent "$TUIK_OPENSEARCH_URL/_cluster/health?wait_for_status=yellow&timeout=10s"
      - name: OpenSearch contracts (no live TÜİK requests)
        run: pytest -m opensearch -q --junitxml=opensearch-results.xml
      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opensearch-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: opensearch-results.xml
          if-no-files-found: warn
          retention-days: 14

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t tuik-mcp .
