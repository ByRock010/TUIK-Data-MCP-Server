name: Package installation

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: package-distributions
          path: dist/*
          retention-days: 14

  install:
    name: Install (${{ matrix.os }}, ${{ matrix.profile }}, ${{ matrix.format }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        profile: [core, viz]
        format: [wheel]
        include:
          - os: ubuntu-latest
            profile: core
            format: sdist
    env:
      PROFILE: ${{ matrix.profile }}
      PACKAGE_FORMAT: ${{ matrix.format }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: package-distributions
          path: package-dist
      - name: Install distribution, not source checkout
        shell: python
        run: |
          import glob, os, subprocess, sys
          pattern = "package-dist/*.whl" if os.environ["PACKAGE_FORMAT"] == "wheel" else "package-dist/*.tar.gz"
          (package,) = glob.glob(pattern)
          extra = "[viz]" if os.environ["PROFILE"] == "viz" else ""
          subprocess.run([sys.executable, "-m", "pip", "install", package + extra], check=True)
          subprocess.run([sys.executable, "-m", "pip", "check"], check=True)
      - name: Read-only diagnostics
        run: tuik-mcp-doctor --json
      - name: Outside-checkout MCP and chart smoke (no index or live TÜİK)
        run: python scripts/check_installed_package.py --profile ${{ matrix.profile }}
